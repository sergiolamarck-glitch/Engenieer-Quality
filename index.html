      const dmsInput = document.getElementById('dms-val-input');

      if (!dmsInput || !tagInput || !resultEl) return;

      state.dmsInput = dmsInput.value;
      state.tagInput = tagInput.value;

      let tag = state.tagInput.replace(/^#/, ''); 
      let parts = tag.split('-');
      
      if (parts.length > 1) {

        tag = parts.join('-');
      } else {
        tag = tag + '-' + state.dmsInput;
      }

        { material: 'Cobre', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E58-D2', typicalGround: 'E58-D1', notes: { pt: 'E58 = Abraçadeira mecânica de aperto regulável. ATENÇÃO: NUNCA tente soldar conexões de cobre no campo sem aprovação metalúrgica.' } },

    const DB_TRAYS = {
      Electrical: {
        Ladder: { typical: "E 54A-D1", lug: "E 108", boss: "E 22" },
        Tray: { typical: "E 54A-D2", lug: "E 108", boss: "E 22" }
      },
      Instrumental: {
        Ladder: { typical: "E 54B-D1", lug: "E 09", boss: "E 22" },
        Tray: { typical: "E 54B-D2", lug: "E 09", boss: "E 32B" }
      },
      Lighting: {
        Ladder: { typical: "E 54C-D1", lug: "E 09", boss: "E 22" },
        Tray: { typical: "E 54C-D2", lug: "E 09", boss: "E 22" }
      }
    };

    function initApp() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        state.darkMode = true;
        toggleDarkMode(true);
      } else {
        toggleDarkMode(false);
      }
      switchTab('cq');
    }

    function toggleDarkMode(force) {
      if (force === undefined) {
        state.darkMode = !state.darkMode;
      } else {
        state.darkMode = force;
      }
      const htmlEl = document.documentElement;
      const themeBtn = document.getElementById('theme-toggle-btn');
      
      if (state.darkMode) {
        htmlEl.classList.add('dark');
        themeBtn.innerHTML = Icons.Sun;
        themeBtn.className = "p-2 rounded-lg border border-brand-light bg-brand-darker text-amber-400 hover:bg-brand transition-all";
      } else {
        htmlEl.classList.remove('dark');
        themeBtn.innerHTML = Icons.Moon;
        themeBtn.className = "p-2 rounded-lg border border-zinc-200 bg-slate-50 text-zinc-500 hover:bg-zinc-200 transition-all";
      }
      renderActiveTab();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      
      ['cq', 'hvac', 'bandejas'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}-btn`);
        const btnMob = document.getElementById(`tab-${tab}-btn-mob`);
        
        if (tab === tabId) {
          if (btn) btn.className = "px-4 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 bg-white dark:bg-brand text-brand dark:text-white shadow";
          if (btnMob) btnMob.className = "px-4 py-2 rounded-md text-xs font-bold transition-all flex items-center gap-2 bg-brand dark:bg-brand-accent text-white shadow";
        } else {
          if (btn) btn.className = "px-4 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200";
          if (btnMob) btnMob.className = "px-4 py-2 rounded-md text-xs font-bold transition-all flex items-center gap-2 bg-slate-100 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400";
        }
      });

      renderActiveTab();
    }

    function renderActiveTab() {
      if (state.activeTab === 'cq') {
        renderChecklist();
      } else if (state.activeTab === 'hvac') {
        renderHVAC();
      } else if (state.activeTab === 'bandejas') {
        renderTrays();
      }
    }

    function copyTextToClipboard(text, elementId) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);

      const btn = document.getElementById(elementId);
      const originalText = btn.innerHTML;
      btn.innerHTML = `${Icons.Check} Copiado!`;
      setTimeout(() => {
        btn.innerHTML = originalText;
      }, 1500);
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if(modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        if (modalId === 'modal-boxes') {
          renderEarthingBoxesTable();
        }
      }
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if(modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function toggleChecklist(itemId, action = 'checked') {
      if (state.checkedItems[itemId] === action) {
        delete state.checkedItems[itemId];
      } else {
        state.checkedItems[itemId] = action;
      }
      renderChecklist();
    }

    function clearChecklist() {
      state.checkedItems = {};
      renderChecklist();
    }

    function renderCategoriesBlock(categories) {
      return categories.map(cat => {
        const catTitle = cat.category.pt;
        return `
          <div class="bg-white dark:bg-brand p-5 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm print-break-inside-avoid">
            <h3 class="text-sm font-black text-zinc-800 dark:text-white mb-4 flex items-center gap-2 border-b border-zinc-100 dark:border-brand-darker pb-2">
              <span class="w-2 h-2 rounded-full bg-brand dark:bg-brand-accent"></span>
              ${catTitle}
            </h3>
            <div class="space-y-3">
              ${cat.items.map(item => {
                const status = state.checkedItems[item.id];
                const isChecked = status === 'checked';
                const isNa = status === 'na';
                const isDone = isChecked || isNa;
                
                return `
                  <div class="flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all ${isDone ? 'bg-slate-50 border-brand-accent/40 dark:bg-brand-darker dark:border-brand-accent/50' : 'bg-white border-zinc-200 hover:border-brand-accent/60 dark:bg-brand dark:border-brand-light dark:hover:border-white/50'}" onclick="toggleChecklist('${item.id}', 'checked')">
                    <div class="mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 transition-colors ${isChecked ? 'bg-brand dark:bg-brand-accent border-brand text-white' : (isNa ? 'bg-zinc-400 border-zinc-400 text-white dark:bg-zinc-600 dark:border-zinc-600' : 'border-zinc-300 dark:border-brand-light bg-transparent')}">
                      ${isChecked ? Icons.Check : (isNa ? Icons.Minus : '')}
                    </div>
                    <div class="flex-1 flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                      <span class="text-xs font-semibold leading-relaxed flex-1 mt-0.5 ${isDone ? 'text-zinc-500 dark:text-zinc-400 line-through opacity-70' : 'text-zinc-700 dark:text-zinc-200'}">
                        ${item.text}
                      </span>
                      <div class="flex flex-wrap gap-2 shrink-0 mt-2 sm:mt-0 items-center">
                        <button onclick="event.stopPropagation(); toggleChecklist('${item.id}', 'na')" class="px-2 py-0.5 rounded text-[10px] font-bold border transition-colors ${isNa ? 'bg-zinc-600 text-white border-zinc-700 dark:bg-zinc-300 dark:text-zinc-900' : 'bg-zinc-100 text-zinc-500 border-zinc-200 hover:bg-zinc-200 dark:bg-brand-darker dark:text-zinc-400 dark:border-brand-light dark:hover:bg-brand-light/30'}">
                          N/A
                        </button>
                        ${item.tag ? `<span class="px-2 py-0.5 rounded text-[10px] font-medium bg-zinc-100 text-zinc-600 dark:bg-brand-darker dark:text-zinc-300">${item.tag}</span>` : ''}
                        ${item.tagImportant ? `<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-700 dark:bg-rose-950/60 dark:text-rose-300">${item.tagImportant}</span>` : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderChecklist() {
      let totalItems = 0;
      let checkedCount = 0;

      CHECKLIST_DATA.forEach(cat => {
        cat.items.forEach(item => {
          totalItems++;
          if (state.checkedItems[item.id]) checkedCount++; 
        });
      });
      const progress = totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);
      const internalCats = CHECKLIST_DATA.filter(c => c.type === 'internal');

      let html = `
        <div class="space-y-6 animate-fadeIn">
          <div class="flex flex-col md:flex-row gap-4 justify-between items-center bg-white dark:bg-brand p-4 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm">
            <div class="flex items-center gap-3 w-full md:w-auto">
              <input 
                type="text" 
                id="sheetNameInput"
                value="${state.sheetName}" 
                oninput="state.sheetName = this.value" 
                placeholder="Nome da Folha"
                class="bg-slate-100 dark:bg-brand-darker border border-zinc-200 dark:border-brand-light px-3 py-2 rounded-lg text-sm font-bold w-full md:w-64 outline-none focus:border-brand-accent dark:focus:border-brand-accent transition-colors text-zinc-900 dark:text-zinc-100"
              />
            </div>
            <div class="flex flex-wrap gap-2 justify-end w-full md:w-auto">
              <button onclick="clearChecklist()" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 border border-rose-200 dark:bg-rose-950/40 dark:border-rose-900/50 dark:text-rose-400 font-bold text-xs hover:opacity-80 transition-colors flex items-center gap-1">
                ${Icons.Trash} Limpar
              </button>
              <button onclick="window.print()" class="px-3 py-1.5 rounded-lg bg-zinc-100 text-zinc-700 border border-zinc-300 dark:bg-brand-light dark:border-brand-accent dark:text-zinc-100 font-bold text-xs hover:opacity-80 transition-colors flex items-center gap-1">
                ${Icons.Printer} Imprimir
              </button>
            </div>
          </div>

          <div class="bg-white dark:bg-brand p-4 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-black uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Progresso Geral</span>
              <span class="text-sm font-black text-brand dark:text-brand-accent">${progress}%</span>
            </div>
            <div class="w-full bg-slate-200 dark:bg-brand-darker h-2 rounded-full overflow-hidden">
              <div class="bg-brand dark:bg-brand-accent h-full transition-all duration-300 ease-out" style="width: ${progress}%"></div>

             <div class="w-2 h-6 bg-brand dark:bg-brand-accent rounded-sm"></div>
             <h2 class="text-base font-black uppercase tracking-widest text-brand dark:text-white">Checklist Interno</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-10">
            ${renderCategoriesBlock(internalCats)}
          </div>
        </div>
      `;
      document.getElementById('main-container').innerHTML = html;
      updateDmsTagConversion();
    }

    function getMaterialStyle(mat, isSelected) {
      if (!isSelected) {
        return state.darkMode 
          ? "bg-zinc-900 border-zinc-800 text-zinc-400 hover:bg-brand-darker hover:border-brand-accent/50" 
          : "bg-white border-zinc-200 text-zinc-600 hover:bg-zinc-50 hover:border-zinc-300";
      }
      
      switch (mat) {
        case 'Aço Carbono':
          return state.darkMode ? "bg-zinc-800 border-zinc-500 text-zinc-100 font-bold shadow-md" : "bg-zinc-200 border-zinc-400 text-zinc-800 font-bold shadow-sm";
        case 'Aço Inoxidável':
          return state.darkMode ? "bg-purple-950/60 border-purple-600 text-purple-200 font-bold shadow-md" : "bg-purple-100 border-purple-300 text-purple-800 font-bold shadow-sm";
        case 'Aço Galvanizado':
          return state.darkMode ? "bg-emerald-950/50 border-emerald-700 text-emerald-200 font-bold shadow-md" : "bg-emerald-50 border-emerald-300 text-emerald-800 font-bold shadow-sm";
        case 'Cobre':
          return state.darkMode ? "bg-amber-950/50 border-amber-700 text-amber-200 font-bold shadow-md" : "bg-amber-50 border-amber-300 text-amber-800 font-bold shadow-sm";
        case 'Equipamento':
          return state.darkMode ? "bg-indigo-950/60 border-indigo-600 text-indigo-200 font-bold shadow-md" : "bg-indigo-100 border-indigo-300 text-indigo-800 font-bold shadow-sm";
        default:
          return "bg-brand border-brand-accent text-white font-bold";
      }
    }

    function selectHvacScope(scope) {
      state.hvacScope = scope;
      if (scope === 'piping') {
        state.hvacGeom = 'Circular';
        if (state.hvacMaterial === 'Equipamento') {
          state.hvacMaterial = 'Aço Carbono';
        }
      }
      renderHVAC();
    }

    function selectHvacMaterial(material) {
      state.hvacMaterial = material;
      renderHVAC();
    }

    function selectHvacGeom(geom) {
      if (state.hvacMaterial === 'Equipamento') return;
      state.hvacGeom = geom;
      renderHVAC();
    }

    function selectHvacIso(iso) {
      if (state.hvacMaterial === 'Equipamento') return;
      state.hvacIso = iso;
      renderHVAC();
    }

    function selectHvacConn(conn) {
      if (state.hvacMaterial === 'Equipamento') return;
      state.hvacConn = conn;
      renderHVAC();
    }

    function selectTrayEnv(env) {
      state.trayEnv = env;
      renderTrays();
    }

    function selectTrayType(type) {
      state.trayType = type;
      renderTrays();
    }

    function selectTrayDisc(disc) {
      state.trayDisc = disc;
      renderTrays();
    }

    function setTraySpecial(val) {
      state.traySpecial = val;
      if (val === 'jumper') {
        state.trayJumperType = 'comum'; 
      }
      renderTrays();
    }

    function setTrayJumperType(type) {
      state.trayJumperType = type;
      renderTrays();
    }
    
    function setTrayE86(modeled) {
      state.trayE86Modeled = modeled;
      renderTrays();
    }
    
    function setTrayE86Role(role) {
      state.trayE86Role = role;
      renderTrays();
    }

    function renderTrays() {
      const matched = DB_TRAYS[state.trayDisc][state.trayType];

      let displayTypical = matched.typical;
      let displayLug = matched.lug;
      let displayBoss = matched.boss || "E 22";
      let extraAlertHtml = '';

      let baseTyp = state.trayEnv === 'Indoor' ? 'E 54' : 'E 56';

      if (state.trayEnv === 'Outdoor') {
        displayTypical = displayTypical.replace('E 54', 'E 56');
        if (state.traySpecial === 'none') {
          displayTypical = "E 143-" + (state.trayType === 'Tray' ? 'D2' : 'D1');
          displayBoss = "E 22";
        }
      }

      if (state.traySpecial === 'main_tray') {
        displayTypical = matched.typical; 
        if (state.trayEnv === 'Outdoor') {
          displayTypical = displayTypical.replace('E 54', 'E 56'); 
        }
        displayLug = "E 108"; 
        displayBoss = "E 55"; 
        extraAlertHtml = `
          <div class="my-4 p-4 rounded-xl border border-blue-400 bg-blue-50 dark:bg-brand-darker text-left space-y-2 animate-fadeIn shadow-sm">
            <div class="flex items-center gap-1.5 text-xs font-black uppercase text-blue-700 dark:text-blue-400">▲ MAIN CABLE TRAY</div>
            <div class="text-xs font-bold text-zinc-600 dark:text-zinc-300 leading-relaxed uppercase">
              Típico Mapeado: <span class="bg-brand/5 dark:bg-brand-light px-1.5 py-0.5 rounded text-brand-accent dark:text-white font-black">${displayTypical}</span>
            </div>
          </div>
        `;
      } else if (state.traySpecial === 'jumper') {
        displayBoss = "E 55";
        if (state.trayJumperType === 'comum') {
          displayTypical = "E 55-D1";
          displayLug = state.trayDisc === 'Electrical' ? "E 08" : "E 10"; 
        } else if (state.trayJumperType === 'derivacao') {
          displayTypical = "E 55-D3";
          displayLug = "E 10"; 
        } else if (state.trayJumperType === 'parallel') {
          displayTypical = "E 55-D5";
          displayLug = "E 08"; 
        }
        extraAlertHtml = `
          <div class="my-4 p-4 rounded-xl border border-emerald-400 bg-emerald-50 dark:bg-brand-darker text-left space-y-2 animate-fadeIn shadow-sm">
            <div class="flex items-center gap-1.5 text-xs font-black uppercase text-emerald-700 dark:text-emerald-400">▲ JUMPER ATIVO</div>
            <div class="text-xs font-bold text-zinc-600 dark:text-zinc-300 leading-relaxed uppercase">
              Típico Associado: <span class="bg-brand/5 dark:bg-brand-light px-1.5 py-0.5 rounded text-brand-accent dark:text-white font-black">${displayTypical}</span>
            </div>
          </div>
        `;
      } else if (state.traySpecial === 'cab_16') {
        displayTypical = "Terminal E97 (BUSBAR)";
        displayLug = "E 97";
        displayBoss = "E 22";
      } else if (state.traySpecial === 'cab_120') {
        displayBoss = "E 22";
        if (!state.trayE86Modeled) {
          displayTypical = "HOLD E86";
          displayLug = "N/A";
        } else {
          if (state.trayE86Role === 'parallel') {
            displayTypical = "E86 + CABO TIPO 24";
            displayLug = "E 108";
          } else {
            displayTypical = "EARTHING E86";
            displayLug = "E 08";
          }
        }
      }

      // Preparação dos símbolos SVG
      const cleanLug = displayLug.replace(/\s+/g, '').toUpperCase();
      const cleanTyp = displayTypical.replace(/\s+/g, '').toUpperCase();
      
      const symClass = "stroke-emerald-600 dark:stroke-emerald-400";
      const fillClass = "fill-emerald-600 dark:fill-emerald-400";
      const gridClass = "stroke-zinc-300 dark:stroke-zinc-700";
      const textClass = "fill-zinc-800 dark:fill-zinc-200";

      // SVG LUG isolado (Quadro de baixo)
      let isolatedLugSvg = '';
      if (cleanLug.includes('E08') || cleanLug.includes('108')) { 
        isolatedLugSvg = `
          <svg viewBox="0 0 60 30" class="w-16 h-8 mx-auto stroke-emerald-600 dark:stroke-emerald-400 fill-emerald-600 dark:fill-emerald-400">
            <line x1="10" y1="15" x2="50" y2="15" stroke-width="2"/>
            <circle cx="15" cy="15" r="5" />
            <circle cx="45" cy="15" r="5" />
          </svg>`;
      } else if (cleanLug.includes('E09')) { 
        isolatedLugSvg = `
          <svg viewBox="0 0 60 30" class="w-16 h-8 mx-auto stroke-emerald-600 dark:stroke-emerald-400 fill-emerald-600 dark:fill-emerald-400">
            <line x1="10" y1="15" x2="50" y2="15" stroke-width="2"/>
            <circle cx="30" cy="15" r="5" />
          </svg>`;
      } else if (cleanLug.includes('E10')) { 
        isolatedLugSvg = `
          <svg viewBox="0 0 60 30" class="w-16 h-8 mx-auto stroke-emerald-600 dark:stroke-emerald-400 fill-emerald-600 dark:fill-emerald-400">
            <line x1="10" y1="15" x2="50" y2="15" stroke-width="2"/>
            <polygon points="30,7 22,23 38,23" />
          </svg>`;
      } else if (cleanLug.includes('E97')) { 
        isolatedLugSvg = `
          <svg viewBox="0 0 60 30" class="w-16 h-8 mx-auto stroke-emerald-600 dark:stroke-emerald-400 fill-transparent">
            <rect x="20" y="10" width="20" height="10" stroke-width="2"/>
            <line x1="0" y1="15" x2="20" y2="15" stroke-width="2"/>
            <line x1="40" y1="15" x2="60" y2="15" stroke-width="2"/>
          </svg>`;
      } else {
        isolatedLugSvg = `<div class="text-xs font-bold text-zinc-400 text-center">N/A</div>`;
      }

      // Símbolos Top/Bot no Grid
      let cadLugTopSvg = '';
      if (cleanLug.includes('E08') || cleanLug.includes('108')) { 
        cadLugTopSvg = `<line x1="20" y1="20" x2="70" y2="20" class="${symClass}" stroke-width="2"/><circle cx="30" cy="20" r="4.5" class="${fillClass}"/><circle cx="60" cy="20" r="4.5" class="${fillClass}"/>`;
      } else if (cleanLug.includes('E09')) { 
        cadLugTopSvg = `<line x1="20" y1="20" x2="70" y2="20" class="${symClass}" stroke-width="2"/><circle cx="45" cy="20" r="4.5" class="${fillClass}"/>`;
      } else if (cleanLug.includes('E10')) { 
        cadLugTopSvg = `<line x1="20" y1="20" x2="70" y2="20" class="${symClass}" stroke-width="2"/><polygon points="45,12 36,26 54,26" class="${fillClass}"/>`;
      } else if (cleanLug.includes('E97')) { 
        cadLugTopSvg = `<rect x="30" y="14" width="30" height="12" fill="none" class="${symClass}" stroke-width="2"/><line x1="20" y1="20" x2="30" y2="20" class="${symClass}" stroke-width="2"/><line x1="60" y1="20" x2="70" y2="20" class="${symClass}" stroke-width="2"/>`;
      } else {
        cadLugTopSvg = `<text x="45" y="24" class="fill-rose-500" font-size="12" font-weight="bold" text-anchor="middle">N/A</text>`;
      }

      let cadTypBotSvg = '';
      if (cleanTyp.includes('E55')) { 
        cadTypBotSvg = `<polyline points="30,52 42,52 42,78 30,77" fill="none" class="${symClass}" stroke-width="2"/><line x1="42" y1="60" x2="60" y2="60" class="${symClass}" stroke-width="2"/><line x1="42" y1="68" x2="60" y2="68" class="${symClass}" stroke-width="2"/>`;
      } else { 
        cadTypBotSvg = `<line x1="20" y1="65" x2="70" y2="65" class="${symClass}" stroke-width="2"/><circle cx="45" cy="65" r="3" class="${fillClass}"/>`;
      }

      let html = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fadeIn">
          <div class="lg:col-span-6 space-y-6">
            <div class="bg-white dark:bg-brand p-6 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm flex flex-col gap-6">
              <div>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2 block">1. Ambiente</span>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="selectTrayEnv('Indoor')" class="py-2 px-3 rounded-lg text-xs font-bold transition-all border ${state.trayEnv === 'Indoor' ? 'bg-zinc-800 dark:bg-zinc-200 text-white dark:text-brand border-transparent shadow animate-press' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">INDOOR</button>
                  <button onclick="selectTrayEnv('Outdoor')" class="py-2 px-3 rounded-lg text-xs font-bold transition-all border ${state.trayEnv === 'Outdoor' ? 'bg-zinc-800 dark:bg-zinc-200 text-white dark:text-brand border-transparent shadow animate-press' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">OUTDOOR</button>
                </div>
              </div>

              <div>
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2 block">2. Tipo de Suporte</span>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="selectTrayType('Ladder')" class="py-2 px-2 rounded-xl border text-center transition-all ${state.trayType === 'Ladder' ? 'border-brand-accent dark:border-white bg-brand/5 dark:bg-brand-light/30 text-brand dark:text-white' : 'border-zinc-200 dark:border-brand-light text-zinc-400 dark:text-zinc-500'}">
                    <div class="font-black text-sm">LADDER</div><div class="text-[10px]">H &ge; 100mm</div>
                  </button>
                  <button onclick="selectTrayType('Tray')" class="py-2 px-2 rounded-xl border text-center transition-all ${state.trayType === 'Tray' ? 'border-brand-accent dark:border-white bg-brand/5 dark:bg-brand-light/30 text-brand dark:text-white' : 'border-zinc-200 dark:border-brand-light text-zinc-400 dark:text-zinc-500'}">

                  <button onclick="selectTrayDisc('Lighting')" class="py-2 px-1 rounded-md text-[10px] sm:text-xs font-black uppercase transition-all border ${state.trayDisc === 'Lighting' ? 'bg-zinc-500 text-white border-zinc-500 shadow-md' : 'bg-slate-50 dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-500'}">ILUMINAÇÃO</button>

                <div class="flex flex-wrap gap-2 mb-3">
                  <button onclick="setTraySpecial('none')" class="flex-1 min-w-[80px] py-2.5 px-2 rounded-lg text-[10px] font-bold transition-all border ${state.traySpecial === 'none' ? 'bg-zinc-800 dark:bg-zinc-200 text-white dark:text-brand border-transparent shadow-md' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">Padrão</button>
                  <button onclick="setTraySpecial('main_tray')" class="flex-1 min-w-[100px] py-2.5 px-2 rounded-lg text-[10px] font-bold transition-all border ${state.traySpecial === 'main_tray' ? 'bg-yellow-500 text-white border-transparent shadow-md' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">Main Cable</button>
                  <button onclick="setTraySpecial('jumper')" class="flex-1 min-w-[80px] py-2.5 px-2 rounded-lg text-[10px] font-bold transition-all border ${state.traySpecial === 'jumper' ? 'bg-green-500 text-white border-green-600 shadow-lg scale-[1.02]' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">JUMPER</button>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-3">
                  <button onclick="setTraySpecial('cab_16')" class="flex-1 min-w-[120px] py-2.5 px-2 rounded-lg text-[10px] font-bold transition-all border ${state.traySpecial === 'cab_16' ? 'bg-amber-500 text-white border-transparent shadow-md' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">Cabo 16mm²</button>
                  <button onclick="setTraySpecial('cab_120')" class="flex-1 min-w-[120px] py-2.5 px-2 rounded-lg text-[10px] font-bold transition-all border ${state.traySpecial === 'cab_120' ? 'bg-emerald-600 text-white border-transparent shadow-md' : 'bg-slate-50 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400 border-zinc-200 dark:border-brand-light hover:bg-zinc-100'}">Cabo 120mm² (E86)</button>
                </div>

                ${state.traySpecial === 'jumper' ? `
                  <div class="p-4 bg-green-50 dark:bg-[#122e1b] border-2 border-green-300 dark:border-green-800 rounded-xl space-y-3 animate-fadeIn mt-4 shadow-inner">
                    <div class="flex items-center gap-2 mb-2 text-green-800 dark:text-green-400 font-black uppercase text-xs">Selecione o tipo de Jumper</div>
                    <div class="grid grid-cols-3 gap-2">
                      <button onclick="setTrayJumperType('comum')" class="py-2 px-1 rounded text-[10px] font-black uppercase transition-all border-2 ${state.trayJumperType === 'comum' ? 'bg-pink-500 text-white border-pink-600 shadow-md' : 'bg-white dark:bg-brand-darker text-pink-600 dark:text-pink-400 border-pink-300 dark:border-pink-800'}">COMUM</button>
                      <button onclick="setTrayJumperType('derivacao')" class="py-2 px-1 rounded text-[10px] font-black uppercase transition-all border-2 ${state.trayJumperType === 'derivacao' ? 'bg-green-500 text-white border-green-600 shadow-md' : 'bg-white dark:bg-brand-darker text-green-600 dark:text-green-400 border-green-300 dark:border-green-800'}">DERIVAÇÃO</button>
                      <button onclick="setTrayJumperType('parallel')" class="py-2 px-1 rounded text-[10px] font-black uppercase transition-all border-2 ${state.trayJumperType === 'parallel' ? 'bg-blue-500 text-white border-blue-600 shadow-md' : 'bg-white dark:bg-brand-darker text-blue-600 dark:text-blue-400 border-blue-300 dark:border-blue-800'}">PARALLEL</button>
                    </div>
                  </div>
                ` : ''}

                ${state.traySpecial === 'cab_120' ? `
                  <div class="p-3 bg-emerald-50 dark:bg-emerald-950/20 border border-emerald-200 dark:border-emerald-900/50 rounded-lg space-y-3 animate-fadeIn mt-3">
                    <div>
                      <span class="text-[9px] font-black uppercase text-emerald-800 dark:text-emerald-400 mb-1.5 block">Status do E86 no Modelo 3D</span>
                      <div class="grid grid-cols-2 gap-2">
                        <button onclick="setTrayE86(true)" class="py-1.5 rounded text-[10px] font-bold transition-all border ${state.trayE86Modeled ? 'bg-emerald-600 text-white border-transparent' : 'bg-white dark:bg-brand text-zinc-500 border-emerald-200 dark:border-emerald-800'}">Modelado</button>
                        <button onclick="setTrayE86(false)" class="py-1.5 rounded text-[10px] font-bold transition-all border ${!state.trayE86Modeled ? 'bg-rose-600 text-white border-transparent' : 'bg-white dark:bg-brand text-zinc-500 border-emerald-200 dark:border-emerald-800'}">Não Modelado</button>
                      </div>
                    </div>
                    ${state.trayE86Modeled ? `
                      <div class="animate-fadeIn">
                        <span class="text-[9px] font-black uppercase text-emerald-800 dark:text-emerald-400 mb-1.5 block">Tipo de Conexão E86</span>
                        <div class="grid grid-cols-2 gap-2">
                          <button onclick="setTrayE86Role('normal')" class="py-1.5 rounded text-[10px] font-bold transition-all border ${state.trayE86Role === 'normal' ? 'bg-emerald-600 text-white border-transparent' : 'bg-white dark:bg-brand text-zinc-500 border-emerald-200 dark:border-emerald-800'}">Padrão ${baseTyp}</button>
                          <button onclick="setTrayE86Role('parallel')" class="py-1.5 rounded text-[10px] font-bold transition-all border ${state.trayE86Role === 'parallel' ? 'bg-emerald-600 text-white border-transparent' : 'bg-white dark:bg-brand text-zinc-500 border-emerald-200 dark:border-emerald-800'}">Main Parallel Wire</button>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                ` : ''}

                <button onclick="openModal('modal-boxes')" class="mt-4 w-full py-3 rounded-lg border border-brand-accent dark:border-brand-light bg-brand-subtle dark:bg-brand-light/20 text-brand dark:text-white text-xs font-black uppercase tracking-widest flex justify-center items-center gap-2 hover:bg-brand-accent hover:text-white transition-colors">
                  ${Icons.Box} Caixas de Aterramento
                </button>
              </div>
            </div>
          </div>

          <div class="lg:col-span-6 flex flex-col">
            <div class="bg-white dark:bg-brand p-6 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm flex flex-col justify-between h-full min-h-[300px] gap-6">
              <div class="text-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 block mb-4">Resultado</span>
                <div class="text-4xl lg:text-5xl font-black text-brand dark:text-white tracking-tighter mb-4">${displayTypical}</div>
                <button id="trays-copy-btn" onclick="copyTextToClipboard('${displayTypical}', 'trays-copy-btn')" class="mx-auto flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-100 dark:bg-brand-darker border border-zinc-200 dark:border-brand-light text-zinc-700 dark:text-zinc-200 text-xs font-bold hover:opacity-80 transition-all">${Icons.Copy} Copiar Resultado</button>
              </div>

              ${extraAlertHtml}

              <!-- NOVO BLOCO: TABELA CAD ESTILO SVG UNIFICADA -->
              <div class="my-4">
                <span class="text-[10px] font-black uppercase tracking-wider block mb-2 text-zinc-400 dark:text-zinc-500">Preview da Tabela de CAD (Pós-Earthing Boss)</span>
                <div class="w-full overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-700 bg-slate-50 dark:bg-brand-darker shadow-inner">
                  <svg viewBox="0 0 300 90" class="w-full h-auto font-mono font-bold" style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
                    <!-- Grids com Cores do App -->
                    <g class="${gridClass}" stroke-width="1.5">
                      <line x1="0" y1="5" x2="300" y2="5"/>
                      <line x1="0" y1="45" x2="300" y2="45"/>
                      <line x1="0" y1="85" x2="300" y2="85"/>

                      <line x1="0" y1="5" x2="0" y2="85"/>
                      <line x1="90" y1="5" x2="90" y2="85"/>
                      <line x1="180" y1="5" x2="180" y2="85"/>
                      <line x1="300" y1="5" x2="300" y2="85"/>
                    </g>

                    <!-- Símbolos Injetados (LUG Cima, Típico Baixo) -->
                    ${cadLugTopSvg}
                    ${cadTypBotSvg}

                    <!-- Textos Descritivos Divididos -->
                    <text x="240" y="30" class="${textClass}" font-size="14" text-anchor="middle">${displayLug}</text>
                    <text x="240" y="70" class="${textClass}" font-size="14" text-anchor="middle">${displayTypical}</text>
                  </svg>
                </div>
              </div>

              <!-- TRÊS QUADROS: CÓDIGO, SÍMBOLO SVG ISOLADO, MATERIAL -->
              <div class="grid grid-cols-3 gap-3 min-h-[100px]">
                <div class="p-3 rounded-lg border bg-slate-50 dark:bg-brand-darker border-zinc-200 dark:border-brand-light text-center flex flex-col justify-center">
                  <span class="text-[9px] font-bold uppercase tracking-wider text-zinc-400 block mb-2">CÓDIGO TERMINAL</span>
                  <span class="text-sm font-black text-brand dark:text-white">${displayLug}</span>
                </div>

                <div class="p-3 rounded-lg border bg-slate-50 dark:bg-brand-darker border-zinc-200 dark:border-brand-light text-center flex flex-col items-center justify-center">
                  <span class="text-[9px] font-bold uppercase tracking-wider text-zinc-400 block mb-2">SÍMBOLO LUG</span>
                  ${isolatedLugSvg}
                </div>

                <div class="p-3 rounded-lg border bg-slate-50 dark:bg-brand-darker border-zinc-200 dark:border-brand-light text-center flex flex-col items-center justify-center">
                  <span class="text-[9px] font-bold uppercase tracking-wider text-zinc-400 block mb-2">MATERIAL</span>
                  <div class="text-emerald-600 dark:text-emerald-400 font-black text-[10px] mt-1 uppercase text-center leading-tight">
                    ${state.trayEnv === 'Indoor' ? 'Cobre Estanhado' : 'Aço Inox'}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('main-container').innerHTML = html;
    }

    function getEarthingBoxSymbol(id) {
      const strokeColor = state.darkMode ? '#e4e4e7' : '#18181b';
      let content = '';

      if (id === 'E22²' || id.startsWith('E96')) {
        content = `<rect x="10" y="10" width="60" height="20" stroke-width="2" /><line x1="10" y1="10" x2="70" y2="30" stroke-width="2" /><line x1="10" y1="30" x2="70" y2="10" stroke-width="2" />`;
      } else if (id === 'E23³') {
        content = `<rect x="10" y="10" width="60" height="20" stroke-width="2" /><line x1="10" y1="10" x2="70" y2="30" stroke-width="2" /><line x1="10" y1="30" x2="70" y2="10" stroke-width="2" /><polygon points="10,10 40,20 10,30" fill="${strokeColor}" />`;
      } else if (id === 'E15') {
        content = `<circle cx="40" cy="20" r="10" stroke-width="2" /><circle cx="40" cy="20" r="4" stroke-width="2" />`;
      } else if (id === 'E32') {
        content = `<rect x="15" y="10" width="50" height="10" stroke-width="2" /><polyline points="25,20 25,28 30,28" stroke-width="1.5" /><polyline points="55,20 55,28 50,28" stroke-width="1.5" />`;
      } else if (id === 'E30') {
        content = `<rect x="30" y="5" width="20" height="30" stroke-width="2" /><circle cx="40" cy="28" r="2" stroke-width="1.5" />`;
      } else if (id === 'E31 ( 4 furos)') {
        content = `<rect x="10" y="12" width="60" height="16" stroke-width="2" /><circle cx="20" cy="20" r="2" stroke-width="1.5" /><circle cx="33" cy="20" r="2" stroke-width="1.5" /><circle cx="47" cy="20" r="2" stroke-width="1.5" /><circle cx="60" cy="20" r="2" stroke-width="1.5" />`;
      } else if (id === 'E31 ( 2 furos)') {
        content = `<rect x="30" y="5" width="20" height="30" stroke-width="2" /><circle cx="40" cy="13" r="2" stroke-width="1.5" /><circle cx="40" cy="27" r="2" stroke-width="1.5" />`;
      } else if (id === 'E38') {
        content = `
          <rect x="14" y="14" width="12" height="12" stroke-width="1.5" />
          <line x1="14" y1="14" x2="26" y2="26" stroke-width="1.5" />
          <line x1="14" y1="26" x2="26" y2="14" stroke-width="1.5" />
          <rect x="54" y="14" width="12" height="12" stroke-width="1.5" />
          <line x1="54" y1="14" x2="66" y2="26" stroke-width="1.5" />
          <line x1="54" y1="26" x2="66" y2="14" stroke-width="1.5" />
          <polyline points="26,20 34,20 34,10 46,10 46,20 54,20" stroke-width="1.5" stroke-linejoin="round" />
        `;
      }

      return `<svg viewBox="0 0 80 40" class="w-16 h-8 mx-auto" fill="none" stroke="${strokeColor}">${content}</svg>`;
    }

    function renderEarthingBoxesTable() {
      document.getElementById('earthing-boxes-tbody').innerHTML = EARTHING_BOXES.map(box => `
        <tr class="bg-white dark:bg-brand hover:bg-slate-50 dark:hover:bg-brand-light/20 transition-colors">
          <td class="p-3 border border-zinc-200 dark:border-brand-light font-black text-brand dark:text-white leading-tight">${box.displayName || box.id}</td>
          <td class="p-3 border border-zinc-200 dark:border-brand-light">${getEarthingBoxSymbol(box.id)}</td>
          <td class="p-3 border border-zinc-200 dark:border-brand-light text-center">${box.page}</td>
          <td class="p-3 border border-zinc-200 dark:border-brand-light font-semibold">${box.dwg}</td>
          <td class="p-3 border border-zinc-200 dark:border-brand-light font-medium text-[10px] uppercase max-w-[280px] break-words">${box.desc}</td>
        </tr>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
