  <script>

    const state = {

    const CHECKLIST_DATA = [

        items: [

        ]
      },
      {
        category: "Verificações de Desenho e Layout",
        items: [
          { id: "chk6", text: "Nível e Norte corretos?", tagImportant: "CRÍTICO" },
          { id: "chk7", text: "Escala geral (carimbo) e escalas dos elementos coerentes e visíveis?", tag: "Escala" },
          { id: "chk8", text: "Numeração dos cortes sequencial e correta em múltiplas folhas (ex: 584xxx-00x)?", tag: "Cortes" },

        ]

    ];

    const DB_HVAC = [
      { material: 'Aço Carbono', geometry: 'Retangular', insulated: 'Sem Isolamento', typicalJumper: 'E51A-D1', typicalGround: 'E51A-D2' },
      { material: 'Aço Carbono', geometry: 'Retangular', insulated: 'Com Isolamento', typicalJumper: 'E51B-D1', typicalGround: 'E51B-D2' },
      { material: 'Aço Carbono', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E51C-D1', typicalGround: 'E51C-D2' },
      { material: 'Aço Carbono', geometry: 'Circular', insulated: 'Com Isolamento', typicalJumper: 'E51C-D1', typicalGround: 'E51C-D2' },
      { material: 'Aço Inoxidável', geometry: 'Retangular', insulated: 'Sem Isolamento', typicalJumper: 'E53A-D1', typicalGround: 'E53A-D2' },

      { material: 'Aço Inoxidável', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E53C-D1', typicalGround: 'E52C' },

      { material: 'Aço Galvanizado', geometry: 'Retangular', insulated: 'Sem Isolamento', typicalJumper: 'E52A-D1/D4', typicalGround: 'E52A-D2' },
      { material: 'Aço Galvanizado', geometry: 'Retangular', insulated: 'Com Isolamento', typicalJumper: 'E52B-D3', typicalGround: 'E52B-D2' },
      { material: 'Aço Galvanizado', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E53C-D1', typicalGround: 'E52D' },
      { material: 'Aço Galvanizado', geometry: 'Circular', insulated: 'Com Isolamento', typicalJumper: 'E115B-D2', typicalGround: 'E115B-D1' },
      { material: 'Equipamento', geometry: 'Retangular', insulated: 'Sem Isolamento', typicalJumper: 'E53D', typicalGround: 'E53D' },
      { material: 'Equipamento', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E53D', typicalGround: 'E53D' }

    const DB_PIPING = [
      { material: 'Aço Carbono', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E57/E58-D2', typicalGround: 'E57/E58-D1' },
      { material: 'Aço Inoxidável', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E57/E58-D2', typicalGround: 'E57/E58-D1' },

      { material: 'Cobre', geometry: 'Circular', insulated: 'Com Isolamento', typicalJumper: 'E59B', typicalGround: 'E59B' },
      { material: 'Aço Galvanizado', geometry: 'Circular', insulated: 'Sem Isolamento', typicalJumper: 'E58-D2', typicalGround: 'E58-D1' },
      { material: 'Aço Galvanizado', geometry: 'Circular', insulated: 'Com Isolamento', typicalJumper: 'E59C', typicalGround: 'E59C' }
    ];

    const DB_TRAYS = {
      Electrical: {
        Ladder: { typical: "E 54A-D1", lug: "E 108", boss: "E 22" },
        Tray: { typical: "E 54A-D2", lug: "E 108", boss: "E 22" }
      },
      Instrumental: {
        Ladder: { typical: "E 54B-D1", lug: "E 09", boss: "E 22" },
        Tray: { typical: "E 54B-D2", lug: "E 09", boss: "E 32B" }
      },
      Lighting: {
        Ladder: { typical: "E 54C-D1", lug: "E 09", boss: "E 22" },
        Tray: { typical: "E 54C-D2", lug: "E 09", boss: "E 22" }
      }
    };

    function initApp() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        state.darkMode = true;
        toggleDarkMode(true);
      } else {
        toggleDarkMode(false);
      }
      switchTab('bandejas');
    }

    function toggleDarkMode(force) {
      if (force === undefined) { state.darkMode = !state.darkMode; } 
      else { state.darkMode = force; }
      
      const htmlEl = document.documentElement;
      const themeBtn = document.getElementById('theme-toggle-btn');
      
      if (state.darkMode) {
        htmlEl.classList.add('dark');
        themeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m12.73-12.73l-1.41 1.41"/></svg>';
        themeBtn.className = "p-2 rounded-lg border border-brand-light bg-brand-darker text-amber-400 hover:bg-brand transition-all";
      } else {
        htmlEl.classList.remove('dark');
        themeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
        themeBtn.className = "p-2 rounded-lg border border-zinc-200 bg-slate-50 text-zinc-500 hover:bg-zinc-200 transition-all";
      }
      renderActiveTab();
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      ['cq', 'hvac', 'bandejas'].forEach(tab => {
        const btn = document.getElementById(`tab-${tab}-btn`);
        const btnMob = document.getElementById(`tab-${tab}-btn-mob`);
        
        if (tab === tabId) {
          if (btn) btn.className = "px-4 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 bg-white dark:bg-brand text-brand dark:text-white shadow";
          if (btnMob) btnMob.className = "px-4 py-2 rounded-md text-xs font-bold transition-all bg-brand dark:bg-brand-accent text-white shadow";
        } else {
          if (btn) btn.className = "px-4 py-1.5 rounded-md text-xs font-bold transition-all flex items-center gap-2 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200";
          if (btnMob) btnMob.className = "px-4 py-2 rounded-md text-xs font-bold transition-all bg-slate-100 dark:bg-brand-darker text-zinc-500 dark:text-zinc-400";
        }
      });
      renderActiveTab();
    }

    function renderActiveTab() {
      if (state.activeTab === 'cq') renderChecklist();
      else if (state.activeTab === 'hvac') renderHVAC();
      else if (state.activeTab === 'bandejas') renderTrays();
    }

    function copyTextToClipboard(text, elementId) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      
      const btn = document.getElementById(elementId);
      const originalText = btn.innerHTML;
      btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline"><polyline points="20 6 9 17 4 12"/></svg> Copiado!`;
      setTimeout(() => { btn.innerHTML = originalText; }, 1500);
    }

    function openModal(modalId) {
      const modal = document.getElementById(modalId);
      if(modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        if (modalId === 'modal-boxes') renderEarthingBoxesTable();
      }
    }

    function closeModal(modalId) {
      const modal = document.getElementById(modalId);
      if(modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function toggleChecklist(itemId, action = 'checked') {
      if (state.checkedItems[itemId] === action) {
        delete state.checkedItems[itemId];
      } else {
        state.checkedItems[itemId] = action;
      }
      renderChecklist();
    }

    function clearChecklist() {
      state.checkedItems = {};
      renderChecklist();
    }

    function updateDmsTagConversion() {
      const dmsInput = document.getElementById('dms-val-input');
      const tagInput = document.getElementById('tag-val-input');
      const resultEl = document.getElementById('dms-conversion-result');
      
      if (!dmsInput || !tagInput || !resultEl) return;
      
      state.dmsInput = dmsInput.value;
      state.tagInput = tagInput.value;
      
      let tag = state.tagInput.replace(/^#/, ''); 
      let parts = tag.split('-');
      
      if (parts.length > 1) {
        parts[parts.length - 1] = state.dmsInput; 
        tag = parts.join('-');
      } else {
        if (state.dmsInput) {
            tag = tag + '-' + state.dmsInput;
        }
      }
      
      resultEl.textContent = tag;
    }

    function renderChecklist() {
      let totalItems = 0;
      let checkedCount = 0;

      CHECKLIST_DATA.forEach(cat => {
        cat.items.forEach(item => {
          totalItems++;
          if (state.checkedItems[item.id]) checkedCount++; 
        });
      });
      const progress = totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);

      const renderCategoriesBlock = (categories) => {
        return categories.map(cat => {
          return `
            <div class="bg-white dark:bg-brand p-5 rounded-xl border border-zinc-200 dark:border-brand-light shadow-sm print-break-inside-avoid">
              <h3 class="text-sm font-black text-zinc-800 dark:text-white mb-4 flex items-center gap-2 border-b border-zinc-100 dark:border-brand-darker pb-2">
                <span class="w-2 h-2 rounded-full bg-brand dark:bg-brand-accent"></span>
                ${cat.category}
              </h3>
              <div class="space-y-3">
                ${cat.items.map(item => {
                  const status = state.checkedItems[item.id];
                  const isChecked = status === 'checked';
                  const isNa = status === 'na';
                  const isDone = isChecked || isNa;
                  
                  return `
                    <div class="flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition-all ${isDone ? 'bg-slate-50 border-brand-accent/40 dark:bg-brand-darker dark:border-brand-accent/50' : 'bg-white border-zinc-200 hover:border-brand-accent/60 dark:bg-brand dark:border-brand-light dark:hover:border-white/50'}" onclick="toggleChecklist('${item.id}', 'checked')">
                      <div class="mt-0.5 w-5 h-5 rounded border flex items-center justify-center shrink-0 transition-colors ${isChecked ? 'bg-brand dark:bg-brand-accent border-brand text-white' : (isNa ? 'bg-zinc-400 border-zinc-400 text-white dark:bg-zinc-600 dark:border-zinc-600' : 'border-zinc-300 dark:border-brand-light bg-transparent')}">
                        ${isChecked ? '✓' : (isNa ? '-' : '')}
                      </div>
                      <div class="flex-1 flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                        <span class="text-xs font-semibold leading-relaxed flex-1 mt-0.5 ${isDone ? 'text-zinc-500 dark:text-zinc-400 line-through opacity-70' : 'text-zinc-700 dark:text-zinc-200'}">
                          ${item.text}
                        </span>
                        <div class="flex flex-wrap gap-2 shrink-0 mt-2 sm:mt-0 items-center">

    function selectHvacScope(scope) {
      state.hvacScope = scope;

        state.hvacGeom = 'Circular';
        if (state.hvacMaterial === 'Equipamento') state.hvacMaterial = 'Aço Carbono';

      renderHVAC();
    }
    function selectHvacMaterial(material) { state.hvacMaterial = material; renderHVAC(); }
    function selectHvacGeom(geom) { if (state.hvacMaterial !== 'Equipamento') { state.hvacGeom = geom; renderHVAC(); } }
    function selectHvacIso(iso) { if (state.hvacMaterial !== 'Equipamento') { state.hvacIso = iso; renderHVAC(); } }
    function selectHvacConn(conn) { if (state.hvacMaterial !== 'Equipamento') { state.hvacConn = conn; renderHVAC(); } }

    function getMaterialStyle(mat, isSelected) {
      if (!isSelected) return state.darkMode ? "bg-zinc-900 border-zinc-800 text-zinc-400" : "bg-white border-zinc-200 text-zinc-600";
      switch (mat) {
        case 'Aço Carbono': return state.darkMode ? "bg-zinc-800 border-zinc-500 text-zinc-100 font-bold" : "bg-zinc-200 border-zinc-400 text-zinc-800 font-bold";
        case 'Aço Inoxidável': return state.darkMode ? "bg-purple-950/60 border-purple-600 text-purple-200 font-bold" : "bg-purple-100 border-purple-300 text-purple-800 font-bold";
        case 'Aço Galvanizado': return state.darkMode ? "bg-emerald-950/50 border-emerald-700 text-emerald-200 font-bold" : "bg-emerald-50 border-emerald-300 text-emerald-800 font-bold";
        case 'Cobre': return state.darkMode ? "bg-amber-950/50 border-amber-700 text-amber-200 font-bold" : "bg-amber-50 border-amber-300 text-amber-800 font-bold";
        case 'Equipamento': return state.darkMode ? "bg-indigo-950/60 border-indigo-600 text-indigo-200 font-bold" : "bg-indigo-100 border-indigo-300 text-indigo-800 font-bold";
        default: return "bg-brand border-brand-accent text-white font-bold";

        } else if (code.includes('E51A') || code.includes('E53A')) {
          svgHTML = `<svg viewBox="0 0 400 220" class="w-full h-auto rounded-xl border bg-slate-50 border-zinc-200 dark:bg-brand-darker dark:border-brand-light p-4"><text x="20" y="25" fill="${textColor}" font-size="11" font-weight="600">CONEXÃO DIRETA (E51A/E53A)</text><path d="M 60 170 L 190 170 L 190 60" stroke="${strokeColor}" stroke-width="4" fill="none" /><rect x="175" y="155" width="30" height="30" fill="${strokeBg}" stroke="${borderBg}" rx="1" /><path d="M 196 115 C 250 115, 270 180, 340 180" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" /><rect x="187" y="108" width="18" height="14" fill="#d97706" rx="2" /><text x="225" y="95" fill="${textColor}" font-size="11" font-weight="600">LUG de Cobre</text></svg>`;
        } else if (code.includes('E51B') || code.includes('E53B') || code.includes('E115') || code.includes('E59')) {
          svgHTML = `<svg viewBox="0 0 400 220" class="w-full h-auto rounded-xl border bg-slate-50 border-zinc-200 dark:bg-brand-darker dark:border-brand-light p-4"><text x="20" y="25" fill="${textColor}" font-size="11" font-weight="600">SÉRIE COM ISOLAMENTO (E115/E59)</text><rect x="60" y="110" width="280" height="30" fill="${strokeBg}" stroke="${borderBg}" /><rect x="60" y="85" width="280" height="25" fill="#fef08a" opacity="0.3" stroke="#facc15" stroke-width="1" stroke-dasharray="3 3" /><text x="210" y="102" fill="#ca8a04" font-size="9" font-weight="600">Isolamento Elétrico</text><path d="M 200 80 C 240 50, 280 50, 320 80" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" /><text x="225" y="175" fill="${textColor}" font-size="11" font-weight="600">Pino Extensor</text></svg>`;
        } else if (code.includes('E57')) {
          svgHTML = `<svg viewBox="0 0 400 220" class="w-full h-auto rounded-xl border bg-slate-50 border-zinc-200 dark:bg-brand-darker dark:border-brand-light p-4"><text x="20" y="25" fill="${textColor}" font-size="11" font-weight="600">ORELHA SOLDADA (E57)</text><path d="M 70 170 C 70 90, 150 70, 240 70" stroke="${strokeBg}" stroke-width="16" fill="none" stroke-linecap="round" /><path d="M 180 38 C 230 38, 275 90, 320 110" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" /><rect x="172" y="32" width="16" height="12" fill="#d97706" rx="1" /><text x="210" y="155" fill="#f87171" font-size="11" font-weight="600">Soldadura de Campo</text></svg>`;
        } else if (code.includes('E58') || code.includes('E52A')) {
          svgHTML = `<svg viewBox="0 0 400 220" class="w-full h-auto rounded-xl border bg-slate-50 border-zinc-200 dark:bg-brand-darker dark:border-brand-light p-4"><text x="20" y="25" fill="${textColor}" font-size="11" font-weight="600">ABRAÇADEIRA (E58 / E52A)</text><circle cx="150" cy="120" r="45" fill="none" stroke="${strokeBg}" stroke-width="10" /><path d="M 133 70 C 100 40, 50 70, 35 110" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" /><text x="220" y="110" fill="${textColor}" font-size="11" font-weight="600">Abraçadeira Mecânica</text></svg>`;
        } else {
          svgHTML = `<svg viewBox="0 0 400 220" class="w-full h-auto rounded-xl border bg-slate-50 border-zinc-200 dark:bg-brand-darker dark:border-brand-light p-4"><text x="20" y="25" fill="${textColor}" font-size="11" font-weight="600">LIGAÇÃO EQUIPOTENCIAL</text><rect x="50" y="60" width="110" height="80" fill="${strokeBg}" stroke="${borderBg}" stroke-width="2" rx="4" /><path d="M 160 100 C 230 100, 260 170, 330 170" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" /><rect x="145" y="92" width="20" height="16" fill="#d97706" rx="2" /><text x="185" y="90" fill="${textColor}" font-size="11" font-weight="600">Aterramento de Continuidade</text></svg>`;

      let html = `

                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg> Dutos HVAC
                  </button>

                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="inline"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg> Tubulações
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2 block">2. Material</span>
                  <div class="flex flex-col gap-2">
                    ${materials.map(mat => `<button onclick="selectHvacMaterial('${mat}')" class="py-1.5 px-3 rounded-md border text-xs transition-all ${getMaterialStyle(mat, state.hvacMaterial === mat)}">${mat}</button>`).join('')}
                  </div>
                </div>
                <div>
                  <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2 block">3. Geometria</span>
                  <div class="flex flex-col gap-2">
                    <button ${isEquipment ? 'disabled' : ''} onclick="selectHvacGeom('Retangular')" class="py-1.5 px-3 rounded-md border text-xs font-bold transition-all ${isEquipment ? 'opacity-30 cursor-not-allowed border-zinc-200 dark:border-brand-light text-zinc-400' : (state.hvacGeom === 'Retangular' ? 'border-brand-accent dark:border-white bg-brand/5 dark:bg-brand-light/30 text-brand dark:text-white' : 'border-zinc-200 dark:border-brand-light text-zinc-400 dark:text-zinc-500 opacity-60')}">Retangular</button>
                    <button ${isEquipment ? 'disabled' : ''} onclick="selectHvacGeom('Circular')" class="py-1.5 px-3 rounded-md border text-xs font-bold transition-all ${isEquipment ? 'opacity-30 cursor-not-allowed border-zinc-200 dark:border-brand-light text-zinc-400' : (state.hvacGeom === 'Circular' ? 'border-brand-accent dark:border-white bg-brand/5 dark:bg-brand-light/30 text-brand dark:text-white' : 'border-zinc-200 dark:border-brand-light text-zinc-400 dark:text-zinc-500 opacity-60')}">Circular</button>
                  </div>

              <div class="grid grid-cols-2 gap-4">

                  <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-2 block">4. Isolamento</span>

                    <button ${isEquipment ? 'disabled' : ''} onclick="selectHvacConn('ground')" class="py-1.5 px-3 rounded-md border text-xs font-bold transition-all ${isEquipment ? 'opacity-30 cursor-not-allowed border-zinc-200 dark:border-brand-light text-zinc-400' : (state.hvacConn === 'ground' ? 'border-brand dark:border-white bg-brand/5 dark:bg-brand-light/30 text-brand dark:text-white' : 'border-zinc-200 dark:border-brand-light text-zinc-400 dark:text-zinc-500')}">Geral (Malha)</button>
                  </div>
                </div>

              <button onclick="openModal('modal-boxes')" class="mt-2 py-3 rounded-lg border border-brand-accent dark:border-brand-light bg-brand-subtle dark:bg-brand-light/20 text-brand dark:text-white text-xs font-black uppercase tracking-widest flex justify-center items-center gap-2 hover:bg-brand-accent hover:text-white transition-colors">Caixas de Aterramento</button>
            </div>

              <div class="text-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400 dark:text-zinc-500 block mb-4">Resultado de Engenharia</span>

      document.getElementById('main-container').innerHTML = html;
    }

    function selectTrayEnv(env) { state.trayEnv = env; renderTrays(); }
    function selectTrayType(type) { state.trayType = type; renderTrays(); }
    function selectTrayDisc(disc) { state.trayDisc = disc; renderTrays(); }
    function selectEarthingType(type) { state.earthingType = type; renderTrays(); }
    function selectE55Detail(det) { state.e55Detail = det; renderTrays(); }
    function selectSpecialType(type) { state.specialType = type; renderTrays(); }
    function setTrayE86(modeled) { state.trayE86Modeled = modeled; renderTrays(); }
    function setTrayE86Role(role) { state.trayE86Role = role; renderTrays(); }

    function renderTrays() {
      const matched = DB_TRAYS[state.trayDisc][state.trayType];

      let displayTypical = matched.typical;

      `;
      document.getElementById('main-container').innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
